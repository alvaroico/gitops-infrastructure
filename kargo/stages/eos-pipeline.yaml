apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: eos-platform
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: gitops-repo
      sources:
        direct: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: eos-platform
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: gitops-repo
      sources:
        stages:
          - dev # 👈 GATE: Só promove para Produção se tiver passado por Dev com sucesso
