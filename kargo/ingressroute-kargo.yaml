apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kargo-server-ingressroute
  namespace: kargo
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kargo.alvaroico-teste.com.br`)
      kind: Rule
      services:
        - name: kargo-api
          port: 443
          scheme: https
  tls:
    certResolver: letsencrypt
