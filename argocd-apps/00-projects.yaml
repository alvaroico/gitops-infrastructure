apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: argocd
  labels:
    env: dev
spec:
  description: "Ambiente de Desenvolvimento - GitOps Infrastructure"
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*-dev"
      server: "https://kubernetes.default.svc"
    - namespace: "eos-dev"
      server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
  labels:
    env: prod
spec:
  description: "Ambiente de Producao - GitOps Infrastructure"
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*-prod"
      server: "https://kubernetes.default.svc"
    - namespace: "eos-prod"
      server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
