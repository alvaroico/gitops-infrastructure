apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eos-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/alvaroico/gitops-infrastructure.git"
    targetRevision: main
    path: apps/eos/overlays/prod
  destination:
    server: "https://kubernetes.default.svc"
    namespace: eos-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
