apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eos-dev
  namespace: argocd
  labels:
    env: dev
    tier: backend
    app.kubernetes.io/part-of: eos
spec:
  project: dev
  source:
    repoURL: "https://github.com/alvaroico/gitops-infrastructure.git"
    targetRevision: main
    path: apps/eos/overlays/dev
  destination:
    server: "https://kubernetes.default.svc"
    namespace: eos-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
