name: CI/CD - Build & Deploy Automático K3s

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Obter o código-fonte
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2. Obter hash curto do commit para a tag da imagem
      - name: Calcular Short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      # 3. Autenticar no GitHub Container Registry (GHCR)
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Configurar Docker Buildx
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Construir e enviar a imagem para o GHCR
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest

      # 6. Conectar na VPN Tailscale para alcançar o cluster local
      - name: Conectar à rede Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # 7. Configurar contexto do Kubectl com Kubeconfig dos Secrets
      - name: Configurar Kubectl Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}

      # 8. Garantir que os manifestos básicos estão aplicados
      - name: Aplicar Manifestos Base
        run: |
          kubectl apply -f apps/node-api/service.yaml
          kubectl apply -f apps/node-api/ingress.yaml

      # 9. Atualizar a imagem no Deployment e aguardar o Rollout (Zero Downtime)
      - name: Executar Rolling Update no Cluster
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ env.SHORT_SHA }}"
          echo "Disparando atualização para: $IMAGE_TAG"
          
          # Atualiza a imagem e a variável de versão
          kubectl set image deployment/node-api api=$IMAGE_TAG
          kubectl set env deployment/node-api APP_VERSION="sha-${{ env.SHORT_SHA }}"
          
          # Aguarda a verificação de saúde (readinessProbe) dos novos pods
          kubectl rollout status deployment/node-api --timeout=120s
